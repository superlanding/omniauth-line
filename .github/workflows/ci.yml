name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '2.7.6'
          - '3.0.7'
          - '3.1.7'
        rails:
          - '6.0'
          - '7.0'
        include:
          - ruby: '2.7.6'
            rails: '6.0'
            gemfile: gemfiles/rails_6.0.gemfile
          - ruby: '2.7.6'
            rails: '7.0'
            gemfile: gemfiles/rails_7.0.gemfile
          - ruby: '3.0.7'
            rails: '6.0'
            gemfile: gemfiles/rails_6.0.gemfile
          - ruby: '3.0.7'
            rails: '7.0'
            gemfile: gemfiles/rails_7.0.gemfile
          - ruby: '3.1.7'
            rails: '6.0'
            gemfile: gemfiles/rails_6.0.gemfile
          - ruby: '3.1.7'
            rails: '7.0'
            gemfile: gemfiles/rails_7.0.gemfile

    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true

    - name: Run tests
      run: bundle exec rspec

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      if: matrix.ruby == '3.1.7' && matrix.rails == '7.0'
      with:
        files: ./coverage/.resultset.json
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
